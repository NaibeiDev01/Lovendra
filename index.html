
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24123d">
  <title>Lovendra — Find Your Person</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #160d26;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #39274d;
    }

    .logo {
      color: #f5a6c8;
      font-size: 29px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 22px;
    }

    .heart {
      font-size: 62px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(34px, 9vw, 54px);
      margin: 0 0 15px;
    }

    h1 span {
      color: #f5a6c8;
    }

    p {
      color: #d2c8df;
      line-height: 1.7;
      max-width: 420px;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 28px;
      background: #ef91bb;
      color: #24123d;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #a99bb9;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #a99bb9;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">♥ LOVENDRA</div>
  </header>

  <main class="hero">
    <div class="heart">💗</div>
    <h1>Find your <span>person.</span></h1>
    <p>
      Meaningful connections start here.
      Meet people who share your values and
      are looking for a genuine relationship.
    </p>

    <a class="button" href="#welcome">
      Discover Lovendra
    </a>

    <p class="note">
      Made for adults 18+ · Real connections, lasting relationships
    </p>
  </main>

  <footer id="welcome">
    Lovendra · Find your person, build your future.
  </footer>
</body>
</html>
